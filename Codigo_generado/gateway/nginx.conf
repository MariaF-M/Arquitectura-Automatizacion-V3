# Gateway: una sola URL para todo el backend (la usan los microfrontends).
#   http://localhost:8080/api/<contexto>/...  ->  servicio del contexto
# Generado desde V8 (contextos) y V9 (ACL).
server {
    listen 80;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    if ($request_method = OPTIONS) { return 204; }

    location = /api/salud { default_type application/json; return 200 '{"gateway":"ok"}'; }

    # Inventario (D-01 CORE) — python
    location /api/inventario/ {
        proxy_pass http://inventario:8001/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
    }

    # Vencimientos (D-02 CORE) — java
    location /api/vencimientos/ {
        proxy_pass http://vencimientos:8002/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
    }

    # Planificación de Demanda (D-03 SUPPORTING) — python
    location /api/planificacion-de-demanda/ {
        proxy_pass http://planificacion-de-demanda:8003/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
    }

    # Abastecimiento (D-04 SUPPORTING) — csharp
    location /api/abastecimiento/ {
        proxy_pass http://abastecimiento:8004/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
    }

    # Seguridad y Auditoría (D-05 GENERIC) — python
    location /api/seguridad-y-auditoria/ {
        proxy_pass http://seguridad-y-auditoria:8005/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
    }

    # ACL-01 Adaptador anticorrupción e interoperabilidad
    location /api/acl-01-anticorrupcion/ {
        proxy_pass http://acl-01-anticorrupcion:8010/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
    }
}
